- id: bedroom_light
  alias: Переключение кроватного светильника
  trigger:
  - platform: mqtt
    topic: "zigbee2mqtt_1/bedroom_switch/action"
    payload: "single_right"
  action:
  - service: switch.toggle
    data: {}
    target:
      entity_id:
      - switch.bedroom_light
- id: bedroom_light_2
  alias: Переключение основного света в спальне
  trigger:
  - platform: mqtt
    topic: "zigbee2mqtt_1/bedroom_switch/action"
    payload: "single_left"
  action:
  - service: light.toggle
    data:
      brightness_pct: 100
      color_name: darkgreen
    target:
      entity_id:
      - light.light_bedroom_ambilight
      - light.light_bedroom
- id: bedroom_light_3
  alias: Переключение ночного света в спальне
  trigger:
  - platform: mqtt
    topic: "zigbee2mqtt_1/bedroom_switch/action"
    payload: "double_right"
  action:
  - service: light.turn_off
    entity_id: light.light_bedroom
  - service: light.toggle
    data:
      brightness_pct: 100
      color_name: darkblue
    target:
      entity_id: light.light_bedroom_ambilight
- id: door_open
