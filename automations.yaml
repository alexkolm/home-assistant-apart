- id: light_on_koridor
  alias: Включение света в коридоре по движению
  trigger:
  - platform: state
    entity_id: binary_sensor.motion_sensor_occupancy
    to: 'on'
  condition:
  - condition: and
    conditions:
    - condition: state
      entity_id: input_boolean.coridor_motion
      state: 'on'
    - condition: numeric_state
      entity_id: sensor.motion_sensor_illuminance_2
      below: 8
  action:
  - service: switch.turn_on
    target:
      entity_id:
      - switch.door_light_plug
- id: light_off_koridor
  alias: Выключение света в коридоре после движения
  trigger:
  - platform: state
    entity_id: binary_sensor.motion_sensor_occupancy
    to: 'off'
  action:
  - service: switch.turn_off
    target:
      entity_id:
      - switch.door_light_plug

