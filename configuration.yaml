
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  
shell_command:
  check_zigbee: 'python3 /config/check_zigbee.py'
  
command_line:
  - sensor:
      name: Zigbee Check
      unique_id: zigbee_check
      command: "cat /config/zigbee_check_status.json"
      value_template: "{{ value_json.status }}"
      json_attributes:
        - state_age_seconds
        - offline_count
        - checked_at
        - offline_devices
      scan_interval: 3600
      
input_datetime:
  zigbee_last_alert:
    name: Zigbee Last Alert
    has_date: true
    has_time: true

input_boolean:
  away_home:
    name: Уехали надолго
    icon: mdi:airplane-takeoff
  coridor_motion:
    name: Свет по движению в коридоре
    icon: mdi:motion-sensor
  notify_count:
    name: Показания счетчиков переданы
    icon: mdi:counter    
  notify_door:
    name: Уведомления от входной двери
    icon: mdi:door
    
group:
  family:
    name: Owners
    entities:
      - device_tracker.alex
      - device_tracker.tanya
      
# Text to speech
tts:
  - platform: google_translate

notify:
  - name: me
    platform: telegram
    chat_id: !secret telegram_chat_id

lovelace:
  resource_mode: yaml
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Overview
      icon: mdi:view-dashboard
      show_in_sidebar: true

mqtt:
  sensor:
    - name: "Motion Sensor Illuminance"
      state_topic: "zigbee2mqtt_1/motion_sensor"
      value_template: "{{ value_json.illuminance }}"
      unit_of_measurement: "lx"
      device_class: illuminance
      # Дополнительные параметры для стабильной работы
      expire_after: 7200  # Через 2 часа без данных станет unavailable
      force_update: true
      
sensor:
- platform: time_date
  display_options:
    - 'time'
    - 'date'
    - 'date_time'
    
template:
  - sensor:
      - name: "next_sunrise"
        state: >
          {{ as_timestamp(state_attr('sun.sun', 'next_rising')) | timestamp_custom('%H:%M') }}
        unique_id: "next_sunrise"
        
      - name: "next_sunset"
        state: >
          {{ as_timestamp(state_attr('sun.sun', 'next_setting')) | timestamp_custom('%H:%M') }}
        unique_id: "next_sunset"
        
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
