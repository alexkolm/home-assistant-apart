# ── automations.yaml ─────────────────────────────────────────────────────────
# УДАЛИТЬ обе старые автоматизации (zigbee_check_telegram, zigbee_check_hourly)
# и вставить вместо них эту.

- id: zigbee_monitor_alert
  alias: "[Zigbee] Мониторинг: уведомления"
  description: >-
    Пишет в Telegram сразу, когда меняется набор проблемных устройств
    (новые / вернувшиеся), напоминает в 10:00, пока проблема не устранена,
    и сообщает, если сам сенсор мониторинга перестал работать.
  mode: queued
  max: 5
  triggers:
    - trigger: state
      id: changed
      entity_id: sensor.zigbee_check
      attribute: problem_key
    - trigger: time
      id: reminder
      at: "10:00:00"
    - trigger: state
      id: sensor_dead
      entity_id: sensor.zigbee_check
      to:
        - unavailable
        - unknown
      for: "01:00:00"
  conditions:
    - condition: template
      alias: "Пропускаем рестарт HA и напоминания при status=ok"
      value_template: >-
        {{ trigger.id == 'sensor_dead'
           or (trigger.id == 'reminder'
               and states('sensor.zigbee_check') not in ['ok', 'unknown', 'unavailable'])
           or (trigger.id == 'changed'
               and trigger.from_state is not none
               and trigger.from_state.state not in ['unknown', 'unavailable']
               and trigger.to_state.state not in ['unknown', 'unavailable']) }}
  actions:
    - variables:
        status: "{{ states('sensor.zigbee_check') }}"
        names: "{{ state_attr('sensor.zigbee_check', 'offline_names') or [] }}"
        prev_names: >-
          {{ trigger.from_state.attributes.get('offline_names', [])
             if trigger.id == 'changed' else [] }}
    - action: notify.me
      data:
        parse_mode: html
        message: |-
          {%- if trigger.id == 'sensor_dead' -%}
          🚨 <b>Мониторинг Zigbee не работает</b>
          Сенсор <code>sensor.zigbee_check</code> недоступен больше часа.
          Проверьте <code>/config/check_zigbee.py</code> и лог HA.
          {%- else -%}
          {%- set diff = status in ['ok', 'offline'] -%}
          {%- set new = names | reject('in', prev_names) | list -%}
          {%- set gone = prev_names | reject('in', names) | list -%}
          {%- if trigger.id == 'reminder' -%}
          🔁 Напоминание: проблема не устранена
          {% endif -%}
          {{ state_attr('sensor.zigbee_check', 'report') }}
          {%- if diff and trigger.id == 'changed' and status == 'offline' and new %}

          🆕 Новые: {{ new | map('e') | join(', ') }}
          {%- endif %}
          {%- if diff and gone %}

          ✅ Вернулись на связь: {{ gone | map('e') | join(', ') }}
          {%- endif %}
          {%- endif -%}

- id: bedroom_and_koridor_lamps_off
  alias: "Контроль люстр — выключить после 5 часов работы"
  trigger:
    - platform: time_pattern
      minutes: "/30"
  condition: []
  action:
    - if:
        - condition: state
          entity_id: light.light_bedroom
          state: "on"
        - condition: template
          value_template: >
            {{ (now() - states.light.light_bedroom.last_changed).total_seconds() > 5 * 3600 }}
      then:
        - service: light.turn_off
          target:
            entity_id: light.light_bedroom
        - service: notify.me
          data:
            message: |
              ⚠️ Люстра в спальне горела более 5 часов.
              Автоматически отключена.

    - if:
        - condition: state
          entity_id: light.light_koridor
          state: "on"
        - condition: template
          value_template: >
            {{ (now() - states.light.light_koridor.last_changed).total_seconds() > 5 * 3600 }}
      then:
        - service: light.turn_off
          target:
            entity_id: light.light_koridor
        - service: notify.me
          data:
            message: |
              ⚠️ Люстра в коридоре горела более 5 часов.
              Автоматически отключена.
  mode: parallel
  max: 3  # (опционально) ограничение на количество одновременных запусков


- id: soil_moisture_check
  alias: Влага почвы — напоминание при понижении
  trigger:
    - platform: numeric_state
      entity_id: sensor.plant_sensor_soil_moisture
      below: 100
      for: "00:00:10"  # чтобы избежать ложных срабатываний
    - platform: time
      at: "10:00:00"  # ежедневное напоминание в 10 утра
  condition:
    - condition: numeric_state
      entity_id: sensor.plant_sensor_soil_moisture
      below: 100
  action:
    - service: notify.me
      data:
        message: | 
          Проверьте влажность почвы у цветов в квартире
           🌱 Влажность ниже 100%.
           
- id: sun_set
  alias: Закат (использую для проверки, включен ли сервер)
  trigger:
    - platform: sun
      event: sunset
  action:
    - service: notify.me
      data:
        message: |
          ЕКБ: Солнце село 🌅
          temp out {{ states('sensor.balkon_sensor_temperature') | float(0) | round(1) }}°C / in {{ states('sensor.kitchen_sensor_temperature') | float(0) | round(1) }}°C
  mode: single

- id: leaving_home
  alias: Хозяин покинул дом
  trigger:
    platform: state
    to: not_home
    entity_id: device_tracker.alex
  action:
  - service: notify.me
    data:
      message: 'ЕКБ: Хозяин ушёл, уведомления об открытии двери включены'
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.notify_door
- id: entering_home
  alias: Хозяин вернулся в дом
  trigger:
    platform: state
    to: home
    entity_id: device_tracker.alex
  action:
  - service: notify.me
    data:
      message: 'ЕКБ: Хозяин пришёл, уведомления об открытии двери отключены'
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.notify_door
- id: faraway
  alias: Включение режима, когда уезжаем из дома надолго
  triggers:
  - entity_id: sensor.coridor_switch4_action
    to: 4_double
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.away_home
    state: 'off'
  actions:
  - entity_id: input_boolean.away_home
    action: input_boolean.turn_on
  - target:
      entity_id: !secret yandex_station_main
    data:
      media_content_id: Включаем режим уехали надолго
      media_content_type: text
      extra:
        volume_level: 0.7
    action: media_player.play_media
  - target:
      entity_id: climate.bedroom_battery
    data:
      temperature: 16
    action: climate.set_temperature  
    
  - service: switch.turn_off
    entity_id: switch.boiler_plug
  - service: switch.turn_off
    entity_id: switch.kran_kholodnoi_vody_v_vannoi_switch_1
  mode: single
- id: airvent_humi
  alias: Запуск вентилятора ванной, когда влажность выше 50%
  trigger:
  - platform: mqtt
    topic: zigbee2mqtt_1/bath_sensor
  condition:
  - condition: template
    value_template: '{{ trigger.payload_json.humidity > 50 }}'
  action:
  - service: switch.turn_on
    entity_id: switch.air_vent_relay
  - delay: 00:05:00
  - service: switch.turn_off
    entity_id: switch.air_vent_relay

- id: warm_floor_sync
  alias: "Тёплый пол — синхронизация реле с расписанием"
  description: >-
    Приводит switch.warm_floor_relay в соответствие с
    binary_sensor.warm_floor_demand (расписание + цикл загрузки + away + сезонный выключатель).
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id: binary_sensor.warm_floor_demand
    - trigger: state
      entity_id: switch.warm_floor_relay
      from: unavailable
    - trigger: homeassistant
      event: start
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    - condition: template
      alias: "Оба состояния известны и расходятся"
      value_template: >-
        {{ states('switch.warm_floor_relay') in ['on', 'off']
           and states('binary_sensor.warm_floor_demand') in ['on', 'off']
           and (states('binary_sensor.warm_floor_demand') == 'on')
               != (states('switch.warm_floor_relay') == 'on') }}
  actions:
    - if:
        - condition: state
          entity_id: binary_sensor.warm_floor_demand
          state: "on"
      then:
        - action: switch.turn_on
          target:
            entity_id: switch.warm_floor_relay
      else:
        - action: switch.turn_off
          target:
            entity_id: switch.warm_floor_relay
            
- id: sink_light
  alias: Переключение света над раковиной кнопкой
  trigger:
  - platform: mqtt
    topic: "zigbee2mqtt_1/sink_light_button/action"
    payload: "single"
  action:
  - service: switch.toggle
    entity_id: switch.sink_light_plug
- id: toilet_vent
  alias: Переключение вентилятора с кнопки в туалете
  trigger:
  - platform: mqtt
    topic: "zigbee2mqtt_1/toilet_button/action"
    payload: "single"
  action:
  - service: switch.toggle
    entity_id: switch.air_vent_relay
- id: coridor_light_1
  alias: Переключение люстры в коридоре с выключателя
  trigger:
  - platform: mqtt
    topic: "zigbee2mqtt_1/coridor_switch4/action"
    payload: "1_single"
  action:
  - service: light.toggle
    entity_id: light.light_koridor
    data:
      brightness_pct: 100
- id: coridor_light_3
  alias: Переключение подсветки двери в коридоре с выключателя
  trigger:
  - platform: mqtt
    topic: "zigbee2mqtt_1/coridor_switch4/action"
    payload: "3_single"
  action:
  - service: switch.toggle
    target:
      entity_id:
      - switch.door_light_plug
- id: bedroom_light
  alias: Переключение кроватного светильника
  trigger:
  - platform: mqtt
    topic: "zigbee2mqtt_1/bedroom_switch/action"
    payload: "single_right"
  action:
  - service: switch.toggle
    data: {}
    target:
      entity_id:
      - switch.bedroom_light
- id: bedroom_light_2
  alias: Переключение основного света в спальне
  trigger:
  - platform: mqtt
    topic: "zigbee2mqtt_1/bedroom_switch/action"
    payload: "single_left"
  action:
  - service: light.toggle
    data:
      brightness_pct: 100
      color_name: darkgreen
    target:
      entity_id:
      - light.light_bedroom_ambilight
      - light.light_bedroom
- id: bedroom_light_3
  alias: Переключение ночного света в спальне
  trigger:
  - platform: mqtt
    topic: "zigbee2mqtt_1/bedroom_switch/action"
    payload: "double_right"
  action:
  - service: light.turn_off
    entity_id: light.light_bedroom
  - service: light.toggle
    data:
      brightness_pct: 100
      color_name: darkblue
    target:
      entity_id: light.light_bedroom_ambilight
- id: door_open
  alias: Оповещение об открытии входной двери
  trigger:
  - platform: state
    entity_id: binary_sensor.door_sensor_contact
    from: 'on'
    to: 'off'
  condition:
  - condition: state
    entity_id: input_boolean.notify_door
    state: 'on'
  action:
  - service: notify.me
    data:
      message: 'ЕКБ: Открытие двери'
- id: water_leak_bathroom
  alias: Протечка в ванной
  triggers:
  - entity_id:
    - binary_sensor.bath_leak_sensor_water_leak
    to: 'on'
    trigger: state
  action:
  - service: notify.me
    data:
      message: 'ЕКБ: Протечка воды в ванной, перекрываем подачу воды'
  - service: switch.turn_off
    entity_id: switch.kran_kholodnoi_vody_v_vannoi_switch_1
  - service: media_player.play_media
    target:
      entity_id: !secret yandex_station_main
    data:
      media_content_id: Внимание! Внимание! Протечка воды в туалете, перекрываем кран
      media_content_type: text
      extra:
        volume_level: 0.9
- id: water_leak_kitchen
  alias: Протечка в кухне
  triggers:
  - entity_id:
    - binary_sensor.kitchen_leak_sensor_water_leak
    to: 'on'
    trigger: state
  action:
  - service: notify.me
    data:
      message: 'ЕКБ: Протечка воды в кухне, перекрываем подачу воды'
  - service: switch.turn_on
    entity_id: switch.kitchen_tap_plug
  - service: media_player.play_media
