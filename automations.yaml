- id: water_leak_bedroom
  alias: Протечка батареи в спальне
  triggers:
  - entity_id:
    - binary_sensor.bedroom_leak_sensor_water_leak
    to: 'on'
    trigger: state
  action:
  - service: notify.me
    data:
      message: !secret security_battery_leak_message
  - service: media_player.play_media
    target:
      entity_id: !secret yandex_station_main
    data:
      media_content_id: Внимание! Внимание! Протечка воды под батареей в спальне
      media_content_type: text
      extra:
        volume_level: 0.9
- id: light_on_koridor
  alias: Включение света в коридоре по движению
  trigger:
  - platform: state
    entity_id: binary_sensor.motion_sensor_occupancy
    to: 'on'
  condition:
  - condition: and
    conditions:
    - condition: state
      entity_id: input_boolean.coridor_motion
      state: 'on'
    - condition: numeric_state
      entity_id: sensor.motion_sensor_illuminance_2
      below: 8
  action:
  - service: switch.turn_on
    target:
      entity_id:
      - switch.door_light_plug
- id: light_off_koridor
  alias: Выключение света в коридоре после движения
  trigger:
  - platform: state
    entity_id: binary_sensor.motion_sensor_occupancy
    to: 'off'
  action:
  - service: switch.turn_off
    target:
      entity_id:
      - switch.door_light_plug

