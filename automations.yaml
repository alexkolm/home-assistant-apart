# Личные сообщения на шлюз BP1_base. Каналы сюда не входят: у них другой
# entity_id. Свои исходящие отсекаются по длинному имени узла.
# Получатель — личный чат с ботом, не групповой telegram_notify_entity.
- id: meshtastic_dm_to_telegram
  alias: "Meshtastic: личное сообщение в Telegram"
  description: >-
    Входящее личное сообщение на шлюз уходит в личный Telegram.
    Сообщения каналов и собственные исходящие не пересылаются.
    message_tag равен !id ноды: polling отдаёт у ответа только номер
    сообщения, адрес потом ищется в input_text.meshtastic_reply_routes.
  mode: queued
  max: 10
  variables:
    node: >-
      {% set sender = trigger.event.data.from_name | default('', true) | string %}
      {% set found = sender | regex_findall('![0-9a-fA-F]{8}') %}
      {{ found[0] if found else '' }}
  triggers:
    - trigger: event
      event_type: meshtastic_message_log
      event_data:
        entity_id: meshtastic.gateway_a1ex_dm
  conditions:
    - condition: template
      value_template: >-
        {% set sender = trigger.event.data.from_name | default('', true) %}
        {% set own = states('sensor.meshtastic_a1ex_1770162712_node_long_name') %}
        {{ sender | trim | length > 0
           and not sender.startswith(own ~ ' (')
           and (trigger.event.data.message | default('', true) | string | trim | length) > 0 }}
  actions:
    - action: telegram_bot.send_message
      data:
        entity_id: !secret telegram_personal_notify_entity
        parse_mode: html
        message_tag: "{{ node }}"
        message: >-
          {% set sender = trigger.event.data.from_name | default('', true) | string %}
          {% set who = sender | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') %}
          {% set body = trigger.event.data.message | string
             | replace('&', '&amp;') | replace('<', '&lt;') | replace('>', '&gt;') %}
          {{ 'ЕКБ: Мештастик, личное\n'
             ~ ('node:' ~ node ~ '\n' if node else '')
             ~ 'от: ' ~ who ~ '\n'
             ~ body }}

# Ответ в Telegram на уведомление выше. Цитата должна содержать строку node:!id.
# Чат берётся из уже загруженного секрета личного notify, новый секрет не нужен.
- id: meshtastic_telegram_reply
  alias: "Meshtastic: ответ из Telegram в сеть"
  description: >-
    Ответ в личном чате на уведомление со строкой node:!id уходит
    личным сообщением с шлюза BP1_base. Длиннее лимита прошивки не шлётся.
  mode: queued
  max: 3
  variables:
    personal_notify: !secret telegram_personal_notify_entity
    quoted: >-
      {% set d = trigger.event.data %}
      {% set reply = d.reply_to_message if d.reply_to_message is defined else none %}
      {% if reply is none and d.message is mapping and d.message.reply_to_message is defined %}
        {% set reply = d.message.reply_to_message %}
      {% endif %}
      {% if reply is mapping %}
        {{ reply.text | default(reply.caption, true) | default('', true) }}
      {% elif reply is string %}
        {{ reply }}
      {% endif %}
    node: >-
      {% set rid = trigger.event.data.reply_to_message_id | default('', true) | string %}
      {% set ns = namespace(node='') %}
      {% for item in states('input_text.meshtastic_reply_routes').split(',') %}
        {% set parts = item.split(':', 1) %}
        {% if parts | length > 1 and parts[0] == rid %}
          {% set ns.node = parts[1] %}
        {% endif %}
      {% endfor %}
      {% if ns.node %}
        {{ ns.node }}
      {% else %}
        {% set found = quoted | regex_findall('node:![0-9a-fA-F]{8}') %}
        {{ found[0][5:] if found else '' }}
      {% endif %}
    body: >-
      {% set d = trigger.event.data %}
      {% if d.text is string %}
        {{ d.text | trim }}
      {% elif d.message is string %}
        {{ d.message | trim }}
      {% elif d.message is mapping %}
        {{ d.message.text | default('', true) | trim }}
      {% endif %}
  triggers:
    - trigger: event
      event_type: telegram_text
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.event.data.chat_id | string == personal_notify.split('_')[-1] }}
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {% set n = body | length %}
                {% set ascii = body | regex_search('[^\x00-\x7F]') is none %}
                {{ node | length == 9 and node[0] == '!'
                   and n > 0 and ((ascii and n <= 200) or (not ascii and n <= 100)) }}
          sequence:
            - action: meshtastic.send_text
              continue_on_error: true
              response_variable: mesh_send
              data:
                to: "{{ node }}"
                text: "{{ body }}"
                ack: true
            # Подтверждение — реакция на самом ответе, без отдельного сообщения в чат.
            # Палец вниз только если сервис радио упал с ошибкой.
            - action: telegram_bot.set_message_reaction
              continue_on_error: true
              data:
                entity_id: !secret telegram_personal_notify_entity
                chat_id: "{{ personal_notify.split('_')[-1] | int }}"
                message_id: "{{ trigger.event.data.id }}"
                reaction: >-
                  {{ '👍' if mesh_send is mapping and mesh_send.sent is defined else '👎' }}
        - conditions:
            - condition: template
              value_template: "{{ trigger.event.data.reply_to_message_id is defined }}"
          sequence:
            - action: notify.send_message
              target:
                entity_id: !secret telegram_personal_notify_entity
              data:
                message: >-
                  Мештастик: не нашёл ноду для этого ответа или текст длиннее лимита.
                  Ответьте на новое уведомление. До 100 русских букв или 200 латинских.

# Запоминает, какому message_id Telegram соответствует !id ноды.
- id: meshtastic_telegram_route
  alias: "Meshtastic: запомнить маршрут ответа"
  description: >-
    telegram_sent с message_tag вида !id дописывает пару в
    input_text.meshtastic_reply_routes. Хранятся последние 10.
  mode: queued
  max: 10
  triggers:
    - trigger: event
      event_type: telegram_sent
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.event.data.message_tag is match('^![0-9a-fA-F]{8}$')
           and trigger.event.data.message_id is number }}
  actions:
    - action: input_text.set_value
      target:
        entity_id: input_text.meshtastic_reply_routes
      data:
        value: >-
          {% set cur = states('input_text.meshtastic_reply_routes') | default('', true) %}
          {% set pair = trigger.event.data.message_id ~ ':' ~ trigger.event.data.message_tag %}
          {% set items = cur.split(',') | reject('equalto', '') | reject('equalto', 'unknown') | reject('equalto', 'unavailable') | list %}
          {% set items = (items + [pair])[-10:] %}
          {{ items | join(',') }}

