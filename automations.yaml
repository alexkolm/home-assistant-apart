- id: zigbee_check_telegram
  alias: "[Zigbee] Telegram Alert"
  description: "Уведомление о проблемах Zigbee2MQTT не чаще одного раза в сутки"
  trigger:
    - platform: time_pattern
      minutes: "0"

  condition:
    - condition: template
      value_template: >
        {{ states('sensor.zigbee_check') in ['offline', 'stale'] }}

    - condition: template
      value_template: >
        {% set last = states('input_datetime.zigbee_last_alert') %}
        {{ last in ['unknown', 'unavailable'] or
           (as_timestamp(now()) - as_timestamp(last)) >= 86400 }}

  action:
    - service: notify.me
      data:
        message: >
          {% if states('sensor.zigbee_check') == 'stale' %}
          ⚠️ **Zigbee2MQTT: проблема с state.json**

          Файл state.json не обновлялся более 1 часа.
          Проверка устройств временно недостоверна.
          {% else %}
          ⚠️ **Zigbee2MQTT: устройства не отвечают**

          {% for device in state_attr('sensor.zigbee_check', 'offline_devices') or [] %}
          • {{ device.name }}
            Последний ответ: {{ device.last_seen }}
            Возраст: {{ (device.age_seconds / 86400) | round(1) }} суток
          {% endfor %}
          {% endif %}

    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.zigbee_last_alert
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  mode: single

- id: zigbee_check_hourly
  alias: "[Zigbee] Check Zigbee2MQTT State"
  description: "Ежечасно проверяет состояние state.json Zigbee2MQTT"
  trigger:
    - platform: time_pattern
      minutes: "0"
  action:
    - service: shell_command.check_zigbee
  mode: single

- id: meshtastic_api_to_telegram
  alias: "[Meshtastic] Forward API Text Message to Telegram"
  description: "Отправляет новое текстовое сообщение из Meshtastic API в Telegram"
  trigger:
    - platform: state
      entity_id: sensor.meshtastic_api_text_message
      attribute: message
  action:
    - variables:
        msg_text: "{{ state_attr('sensor.meshtastic_api_text_message', 'message') }}"
        msg_sender: "{{ state_attr('sensor.meshtastic_api_text_message', 'from') | default('Unknown') }}"
    - service: notify.me
      data:
        message: |
          📡 **Новое сообщение из Meshtastic**
          От: {{ msg_sender }}
          Текст: {{ msg_text }}
  mode: single

- id: bedroom_and_koridor_lamps_off
  alias: "Контроль люстр — выключить после 5 часов работы"
  trigger:
    - platform: time_pattern
      minutes: "/30"
  condition: []
  action:
    - if:
        - condition: state
          entity_id: light.light_bedroom
          state: "on"
        - condition: template
          value_template: >
            {{ (now() - states.light.light_bedroom.last_changed).total_seconds() > 5 * 3600 }}
      then:
        - service: light.turn_off
          target:
            entity_id: light.light_bedroom
        - service: notify.me
          data:
            message: |
              ⚠️ Люстра в спальне горела более 5 часов.
              Автоматически отключена.

    - if:
        - condition: state
          entity_id: light.light_koridor
          state: "on"
        - condition: template
          value_template: >
            {{ (now() - states.light.light_koridor.last_changed).total_seconds() > 5 * 3600 }}
      then:
        - service: light.turn_off
          target:
            entity_id: light.light_koridor
        - service: notify.me
          data:
            message: |
              ⚠️ Люстра в коридоре горела более 5 часов.
              Автоматически отключена.
  mode: parallel
  max: 3  # (опционально) ограничение на количество одновременных запусков


- id: soil_moisture_check
  alias: Влага почвы — напоминание при понижении
  trigger:
    - platform: numeric_state
      entity_id: sensor.plant_sensor_soil_moisture
      below: 100
      for: "00:00:10"  # чтобы избежать ложных срабатываний
    - platform: time
      at: "10:00:00"  # ежедневное напоминание в 10 утра
  condition:
    - condition: numeric_state
      entity_id: sensor.plant_sensor_soil_moisture
      below: 100
  action:
    - service: notify.me
      data:
        message: | 
          Проверьте влажность почвы у цветов в квартире
           🌱 Влажность ниже 100%.
           
- id: sun_set
  alias: Закат (использую для проверки, включен ли сервер)
  trigger:
    - platform: sun
      event: sunset
  action:
    - service: notify.me
      data:
        message: |
          ЕКБ: Солнце село 🌅
          temp out {{ states('sensor.balkon_sensor_temperature') | float(0) | round(1) }}°C / in {{ states('sensor.kitchen_sensor_temperature') | float(0) | round(1) }}°C
  mode: single

- id: leaving_home
  alias: Хозяин покинул дом
  trigger:
    platform: state
    to: not_home
    entity_id: device_tracker.alex
  action:
  - service: notify.me
    data:
      message: 'ЕКБ: Хозяин ушёл, уведомления об открытии двери включены'
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.notify_door
- id: entering_home
  alias: Хозяин вернулся в дом
  trigger:
    platform: state
    to: home
    entity_id: device_tracker.alex
  action:
  - service: notify.me
    data:
      message: 'ЕКБ: Хозяин пришёл, уведомления об открытии двери отключены'
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.notify_door
- id: faraway
  alias: Включение режима, когда уезжаем из дома надолго
  triggers:
  - entity_id: sensor.coridor_switch4_action
    to: 4_double
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.away_home
    state: 'off'
  actions:
  - entity_id: input_boolean.away_home
    action: input_boolean.turn_on
  - target:
      entity_id: !secret yandex_station_main
    data:
      media_content_id: Включаем режим уехали надолго
      media_content_type: text
      extra:
        volume_level: 0.7
    action: media_player.play_media
  - target:
      entity_id: climate.bedroom_battery
    data:
      temperature: 16
    action: climate.set_temperature  
    
  - service: switch.turn_off
    entity_id: switch.boiler_plug
  - service: switch.turn_off
    entity_id: switch.kran_kholodnoi_vody_v_vannoi_switch_1
  mode: single
- id: airvent_humi
  alias: Запуск вентилятора ванной, когда влажность выше 50%
  trigger:
  - platform: mqtt
    topic: zigbee2mqtt_1/bath_sensor
  condition:
  - condition: template
    value_template: '{{ trigger.payload_json.humidity > 50 }}'
  action:
  - service: switch.turn_on
    entity_id: switch.air_vent_relay
  - delay: 00:05:00
  - service: switch.turn_off
    entity_id: switch.air_vent_relay
- id: warm_floor_control
  alias: Управление теплым полом утром и вечером
  trigger:
  - platform: time_pattern
    minutes: "/5"
    seconds: 0
  - platform: time
    at: 
      - "10:00:00"
      - "23:00:00"
  condition:
  - condition: state
    entity_id: input_boolean.away_home
    state: 'off'
  - condition: or
    conditions:
      - condition: time
        after: "08:00:00"
        before: "10:00:00"
      - condition: time
        after: "21:00:00"
        before: "23:00:00"
  action:
  - choose:
      - conditions:
          - condition: time
            before: "10:00:00"
          - condition: time
            after: "08:00:00"
        sequence:
          - service: "switch.toggle"
            entity_id: switch.warm_floor_relay
      - conditions:
          - condition: time
            before: "23:00:00"
          - condition: time
            after: "21:00:00"
        sequence:
          - service: "switch.toggle"
            entity_id: switch.warm_floor_relay
    default:
      - service: "switch.turn_off"
        entity_id: switch.warm_floor_relay
